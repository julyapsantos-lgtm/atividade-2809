<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>TechStore</title>
</head>
<body>
    <header>
        <h1>TechStore  - Soluções em Tecnologia</h1>
        <nav>
            <a href="#home">Início</a>
            <a href="#produtos">Produtos</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <main>
        <section id="produtos">
            <h2>Passo a Passo de Compra</h2>
            <ol>
                <li>Escolha o produto no catálogo</li>
                <li>Informe o endereço de entrega</li>
                <li>Realize o pagamento com segurança</li>
            </ol>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ-n4-TvqQzfVBVL7EkpfjfEEhj0zCh6ytKeeUGZL03-Q&s=10" alt="imagem promocional da loja">
        </section>

        <section id="contato">
             <h2>Contato</h2>
              <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome">

                <label for="email">E-mail:</label>
                <input type="email" id="email">

                <button class="botao-destaque">Enviar</button>
            </form>
        </section>
    </main>
</body>
</html>
